<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BarberMarket</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        .login-section {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-card {
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); 
        }

        .form-label {
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: block;
            color: var(--text);
            font-size: 0.9rem;
        }

        .register-link {
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
            transition: color 0.3s;
        }
        .register-link:hover {
            color: var(--white);
        }
        
        #email {
            width: 100%;
            padding: 1rem;
            font-size: 1rem;
        }

        #password {
            width: 60%;
            padding: 1rem;
            font-size: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
    </style>
</head>

<body class="dark-theme">
    <div id="app">
        <header class="main-header">
            <div class="container header-container">
                <a href="index.html" class="logo">
                    <span class="material-icons">diversity_3</span>
                    <h1>BarberMarket</h1>
                </a>
                <nav id="nav-menu">
                    <a href="index.html" class="nav-link">Voltar ao Início</a>
                </nav>
            </div>
        </header>

        <main id="content">
            <section class="section login-section">
                <div class="container" style="display: flex; justify-content: center; width: 100%;">
                    
                    <div class="card login-card">
                        <div class="text-center">
                            <h2 style="margin-bottom: 0.5rem; color: var(--primary);">Bem-vindo</h2>
                            <p style="margin-bottom: 2rem; color: var(--text-muted); font-size: 0.95rem;">
                                Acesse sua conta para continuar
                            </p>
                        </div>

                        <form id="login-form">
                            <div class="form-group">
                                <label for="email" class="form-label">E-mail</label>
                                <input type="email" id="email" placeholder="ex: joao@email.com" required />
                            </div>

                            <div class="form-group">
                                <label for="password" class="form-label">Senha</label>
                                <input type="password" id="password" placeholder="Sua senha secreta" required />
                            </div>

                            <button type="submit" id="btn-login" class="primary-button" style="width: 100%; margin-top: 1rem;">
                                Acessar Conta
                            </button>
                        </form>

                        <div id="error-container" class="hidden" style="background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #ef4444; padding: 0.8rem; border-radius: 8px; margin-top: 1.5rem; text-align: center; font-size: 0.9rem;">
                            <span id="error-msg">Erro ao logar</span>
                        </div>

                        <div class="text-center" style="margin-top: 2rem; border-top: 1px solid var(--border); padding-top: 1.5rem;">
                            <p style="font-size: 0.9rem; color: var(--text-muted);">
                                Ainda não tem conta? <a href="register.html" class="register-link">Criar conta grátis</a>
                            </p>
                            <p style="margin-top: 10px;">
                                <a href="admin.html" style="font-size: 0.8rem; color: var(--text-muted); text-decoration: none;">Acesso Administrativo</a>
                            </p>
                        </div>
                    </div>

                </div>
            </section>
        </main>

        <footer class="main-footer">
            <div class="container text-center">
                <p style="color: var(--text-muted); font-size: 0.8rem;">&copy; 2026 BarberMarket. Todos os direitos reservados.</p>
            </div>
        </footer>
    </div>

    <script src="services.js"></script>
    <script src="login.js"></script>
</body>
</html>
