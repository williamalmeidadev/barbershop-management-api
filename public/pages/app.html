<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlphaCuts App</title>

    <script>
        (function () {
            var path = window.location.pathname;
            if (path.endsWith('/')) return;
            if (path.split('/').pop().indexOf('.') !== -1) return;
            window.location.replace(path + '/' + window.location.search + window.location.hash);
        })();
    </script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <script src="components/fonts.js"></script>
    <script src="components/basepath.js"></script>
    <script src="components/ui.js"></script>
    <script src="components/cards.js"></script>
    <script src="components/layout.js"></script>
    <script src="components/notifications.js"></script>
    <script src="components/app-utils.js"></script>
    <script src="components/app-components.js"></script>
</head>

    <div id="app"></div>
    <div id="notification-container"></div>

    <script src="components/request.js"></script>
    <script src="components/services.js"></script>
    <script src="js/app.ui.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
