<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - BarberMarket</title>

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@700&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <script>
    if (window.location.pathname.startsWith('/server08')) {
      const base = document.createElement('base');
      base.href = '/server08/';
      document.head.appendChild(base);
    }
  </script>
  <link rel="stylesheet" href="shared/style.css">
  <script src="shared/basepath.js"></script>
</head>

<body class="dark-theme">
  <div id="app">
    <header class="main-header">
      <div class="container header-container">
        <div class="logo">
          <span class="material-icons">diversity_3</span>
          <h1>BarberMarket</h1>
        </div>
        <nav id="nav-menu">
          <a href="/" class="nav-link">Explorar</a>
          <a href="/login" class="nav-button">Login Cliente</a>
        </nav>
      </div>
    </header>

    <main id="content" class="auth-page">
      <section class="auth-hero auth-hero-simple">
        <div class="container auth-shell auth-shell-single">
          <div class="auth-panel">
            <div class="auth-card">
              <div class="auth-header">
                <h3>Setor Administrativo</h3>
                <p>Acesso restrito para gestão da barbearia.</p>
              </div>

              <form id="admin-login-form" class="auth-form">
                <div class="form-group">
                  <label for="email">E-mail</label>
                  <input type="email" id="email" placeholder="Email" required />
                </div>

                <div class="form-group">
                  <label for="password">Senha</label>
                  <input type="password" id="password" placeholder="Sua senha" required />
                </div>

                <button type="submit" class="primary-button">Entrar</button>
              </form>

              <p id="error" class="auth-error"></p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="main-footer">
      <div class="container footer-content">
        <div class="footer-info">
          <h3>BarberMarket</h3>
          <p>Brasil</p>
        </div>
        <div class="footer-social">
          <a href="#"><span class="material-icons">facebook</span></a>
          <a href="#"><span class="material-icons">camera_alt</span></a>
        </div>
        <div class="footer-bottom">
          <p>&copy; 2026 BarberMarket. Tradição e Tecnologia.</p>
        </div>
      </div>
    </footer>
  </div>

  <script src="auth/admin-login.js"></script>
</body>

</html>
