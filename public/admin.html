<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | BarberMarket</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script>
    if (window.location.pathname.startsWith('/server08')) {
      const base = document.createElement('base');
      base.href = '/server08/';
      document.head.appendChild(base);
    }
  </script>
  <link rel="stylesheet" href="/server08/admin.css" />
  <script src="basepath.js"></script>
</head>
<body class="dark-theme">
  <div class="admin-layout">
    
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="material-icons">diversity_3</span>
        <h1>Admin</h1>
      </div>
      
      <nav class="sidebar-nav">
        <button class="nav-item active" data-tab="config">
            <span class="material-icons">tune</span> Configurações
        </button>
        <button class="nav-item" data-tab="clientes">
            <span class="material-icons">people</span> Clientes
        </button>
        <button class="nav-item" data-tab="agendamentos">
            <span class="material-icons">calendar_month</span> Agendamentos
        </button>
        <button class="nav-item" data-tab="vagas">
            <span class="material-icons">event_available</span> Vagas
        </button>
        <button class="nav-item" data-tab="servicos">
            <span class="material-icons">content_cut</span> Serviços
        </button>
        <button class="nav-item" data-tab="barbeiros">
            <span class="material-icons">face</span> Barbeiros
        </button>
      </nav>

      <div class="sidebar-footer">
        <button id="logout-btn" class="btn ghost-danger">
            <span class="material-icons">logout</span> Sair
        </button>
      </div>
    </aside>

    <main class="content">
      <header class="topbar">
        <div>
          <h2>Dashboard</h2>
          <p>Visão geral do sistema</p>
        </div>
        
      </header>

      <section class="tab-panel" id="tab-config">
        <div class="panel">
          <div class="panel-header">
            <h3>Regras de Desconto</h3>
            <button id="btn-config-create" class="btn primary">
                <span class="material-icons">add</span> Nova Regra
            </button>
          </div>
          <div id="config-card-container" class="config-grid"></div>
        </div>
      </section>

      <section class="tab-panel hidden" id="tab-clientes">
        <div class="panel">
          <div class="panel-header">
            <h3>Clientes</h3>
            <button id="load-clientes" class="btn ghost">Atualizar</button>
          </div>
          <div class="form-grid filters">
            <div class="form-group">
              <label>Status</label>
              <select id="clientes-ativo">
                <option value="">Todos</option>
                <option value="1">Ativos</option>
                <option value="0">Inativos</option>
              </select>
            </div>
            <div class="form-group">
              <label>Buscar</label>
              <input type="text" id="clientes-busca" placeholder="Nome ou e-mail" />
            </div>
          </div>
          <div id="clientes-list" class="cards-grid"></div>
        </div>
      </section>

      <section class="tab-panel hidden" id="tab-agendamentos">
        <div class="panel">
          <div class="panel-header">
            <h3>Agendamentos</h3>
            <button id="load-agendamentos" class="btn ghost">Atualizar</button>
          </div>
          <div class="form-grid filters">
            <div class="form-group">
              <label>Status</label>
              <select id="agendamentos-status">
                <option value="">Todos</option>
                <option value="AGENDADO">Agendado</option>
                <option value="CONCLUIDO">Concluído</option>
                <option value="CANCELADO">Cancelado</option>
              </select>
            </div>
            <div class="form-group">
              <label>Buscar (ID)</label>
              <input type="text" id="agendamentos-busca" placeholder="ID Cliente/Barbeiro" />
            </div>
          </div>
          <div id="agendamentos-list" class="cards-grid"></div>
        </div>
      </section>

      <section class="tab-panel hidden" id="tab-vagas">
        <div class="panel">
          <div class="panel-header">
            <h3>Gerenciar Agenda</h3>
            <div class="actions-group">
                <button id="btn-abrir-gerar-vagas" class="btn primary">Gerar Vagas</button>
                <button id="btn-abrir-bloqueio" class="btn ghost">Bloquear</button>
                <button id="btn-abrir-reserva" class="btn ghost">Reservar</button>
            </div>
          </div>
          
          <form id="form-vagas" class="form-grid filters bg-soft">
            <div class="form-group">
              <label>Barbeiro</label>
              <select id="vagas-barbeiro" class="barbeiro-select" required></select>
            </div>
            <div class="form-group">
              <label>Data</label>
              <input type="date" id="vagas-data" required />
            </div>
            <div class="form-group" style="display: flex; align-items: flex-end;">
                <button class="btn full-width">Buscar</button>
            </div>
          </form>
          
          <div id="vagas-list" class="cards-grid compact"></div>
        </div>
      </section>

      <section class="tab-panel hidden" id="tab-servicos">
        <div class="panel">
          <div class="panel-header">
            <h3>Catálogo de Serviços</h3>
            <div class="actions-group">
                <button id="load-servicos" class="btn ghost">Atualizar</button>
                <button id="btn-novo-servico" class="btn primary">Novo Serviço</button>
            </div>
          </div>
          <div id="servicos-list" class="cards-grid"></div>
        </div>
      </section>

      <section class="tab-panel hidden" id="tab-barbeiros">
        <div class="panel">
          <div class="panel-header">
            <h3>Equipe</h3>
            <div class="actions-group">
                <button id="load-barbeiros" class="btn ghost">Atualizar</button>
                <button id="btn-novo-barbeiro" class="btn primary">Novo Barbeiro</button>
            </div>
          </div>
          <div id="barbeiros-list" class="cards-grid"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">Título</h3>
        <button id="modal-close" class="btn-icon"><span class="material-icons">close</span></button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="/server08/admin.js"></script>
</body>
</html>
