<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; color: #333; margin: 0; padding: 20px; }
        .card { background: #ffffff; padding: 30px; border-radius: 8px; max-width: 500px; margin: auto; border-top: 5px solid #ff5722; }
        .alert-icon { font-size: 40px; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="alert-icon">📢</div>
        <h2 style="text-align: center; margin-top: 0;">Nova Solicitação!</h2>
        <p>Atenção, administração AlphaCuts,</p>
        <p>Um novo agendamento acaba de ser solicitado via sistema e aguarda sua aprovação no painel administrativo.</p>
        
        <div style="background: #f9f9f9; padding: 15px; border-radius: 5px; font-family: monospace;">
            ${details}
        </div>

        <p>Acesse o dashboard para aceitar ou recusar este horário.</p>
        <div style="text-align: center; margin-top: 20px;">
            <a href="#" style="background: #333; color: #fff; padding: 12px 20px; text-decoration: none; border-radius: 5px; font-weight: bold;">Abrir Dashboard Admin</a>
        </div>
    </div>
</body>
</html>
