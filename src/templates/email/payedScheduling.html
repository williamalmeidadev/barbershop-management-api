<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #121212; color: #ffffff !important; }
        .container { width: 100%; max-width: 600px; margin: 20px auto; background-color: #1a1a1a; border-radius: 8px; border: 1px solid #333; overflow: hidden; }
        .receipt-header { background-color: #252525; padding: 20px; text-align: center; border-bottom: 1px dashed #444; }
        .content { padding: 30px; }
        .price { font-size: 32px; color: #ff5722 !important; font-weight: bold; text-align: center; margin: 20px 0; }
        .details { border-top: 1px solid #333; padding-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="receipt-header">
            <div style="font-size: 20px; font-weight: bold;">Recibo de Atendimento</div>
            <div style="color: #777;">AlphaCuts Management System</div>
        </div>
        <div class="content">
            <p>Obrigado pela preferência, <strong style="color: #ff5722;">${nome}</strong>!</p>
            <p>Seu atendimento foi finalizado com sucesso. Confira os detalhes abaixo:</p>
            
            <div class="price">${valor}</div>
            
            <div class="details">
                <p><strong>Serviço realizado:</strong> ${servico}</p>
                <p><strong>Status:</strong> Pago / Concluído</p>
            </div>

            <p style="text-align: center; font-size: 14px; margin-top: 30px; color: #888;">
                Sua satisfação é nossa prioridade. Até a próxima! 💈
            </p>
        </div>
    </div>
</body>
</html>
